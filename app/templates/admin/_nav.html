<h1 class="h3 fw-bold mb-3">{{ _("Administration") }}</h1>
<ul class="nav nav-pills mb-4">
  {% for endpoint, icon, label in [('admin.users', 'fa-users', _("Utilisateurs")), ('admin.settings', 'fa-gear', _("Paramètres"))] %}
  <li class="nav-item">
    <a class="nav-link {% if request.endpoint == endpoint %}active{% endif %}" href="{{ url_for(endpoint) }}"
       {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>
      <i class="fa-solid {{ icon }} me-1" aria-hidden="true"></i>{{ label }}</a>
  </li>
  {% endfor %}
</ul>
