{% if contact %}<a href="mailto:{{ contact }}">{{ contact }}</a>
{% else %}<span class="text-body-secondary">{{ _("adresse de contact bientôt disponible") }}</span>
{% if current_user.is_authenticated and current_user.is_admin %}
<span class="badge text-bg-warning ms-1">{{ _("Administrateur : renseignez LEGAL_CONTACT_EMAIL dans .env") }}</span>{% endif %}
{% endif %}
