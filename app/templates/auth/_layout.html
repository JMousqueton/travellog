{% extends "base.html" %}
{% block main_class %}auth-main{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="card auth-card shadow-soft">
    <div class="card-body p-4 p-sm-5">
      <div class="text-center mb-4">
        <span class="brand-mark brand-mark-lg mb-3" aria-hidden="true"><i class="fa-solid fa-earth-europe"></i></span>
        <h1 class="h3 fw-bold mb-1">{% block heading %}{% endblock %}</h1>
        <p class="text-body-secondary mb-0">{% block subheading %}{% endblock %}</p>
      </div>
      {% block form %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
