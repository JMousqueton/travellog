# Travel Log — https://travellog.julien.io (application : travellog.service sur 127.0.0.1:5012)

server {
  listen 80;
  listen [::]:80;
  server_name travellog.julien.io;

  # Renouvellement du certificat (certbot --webroot)
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name travellog.julien.io;

  ssl_certificate     /etc/letsencrypt/live/travellog.julien.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/travellog.julien.io/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers   HIGH:!aNULL:!MD5;

  access_log /var/log/nginx/travellog.access.log;
  error_log  /var/log/nginx/travellog.error.log;

  # Photos : MAX_UPLOAD_MB (64 Mo par défaut)
  client_max_body_size 64m;

  # Fichiers statiques servis directement (noms stables : cache court)
  location /static/ {
    alias /opt/travel/app/static/;
    expires 1h;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    proxy_pass              http://127.0.0.1:5012;
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        X-Forwarded-Host $host;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        Connection "";
    proxy_read_timeout      120;
  }
}
