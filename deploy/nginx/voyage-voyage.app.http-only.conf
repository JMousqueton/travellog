# Étape transitoire, avant le certificat : validation Let's Encrypt et redirection vers HTTPS uniquement.
# Rien n'est servi en HTTP clair. Remplacé par voyage-voyage.app.conf via deploy/enable-https.sh.
server {
  listen 80;
  listen [::]:80;
  server_name voyage-voyage.app www.voyage-voyage.app;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }
  location / {
    return 301 https://voyage-voyage.app$request_uri;
  }
}
