# Voyage Voyage — https://voyage-voyage.app (application : travellog.service sur 127.0.0.1:5012)
# www.voyage-voyage.app et l'ancienne adresse travellog.julien.io redirigent vers https://voyage-voyage.app.

# URL versionnées par l'application (?v=<empreinte>) : cache d'un an ; les autres : 1 heure.
map $arg_v $travellog_static_cache {
  ""      "public, max-age=3600";
  default "public, max-age=31536000, immutable";
}

server {
  listen 80;
  listen [::]:80;
  server_name voyage-voyage.app www.voyage-voyage.app travellog.julien.io;

  # Renouvellement des certificats (certbot --webroot)
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }
  location / {
    return 301 https://voyage-voyage.app$request_uri;
  }
}

# www.voyage-voyage.app -> voyage-voyage.app
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.voyage-voyage.app;

  ssl_certificate     /etc/letsencrypt/live/voyage-voyage.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/voyage-voyage.app/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers   HIGH:!aNULL:!MD5;

  return 301 https://voyage-voyage.app$request_uri;
}

# Ancienne adresse (certificat travellog.julien.io conservé tant qu'il est renouvelé)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name travellog.julien.io;

  ssl_certificate     /etc/letsencrypt/live/travellog.julien.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/travellog.julien.io/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers   HIGH:!aNULL:!MD5;

  return 301 https://voyage-voyage.app$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name voyage-voyage.app;

  ssl_certificate     /etc/letsencrypt/live/voyage-voyage.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/voyage-voyage.app/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers   HIGH:!aNULL:!MD5;

  access_log /var/log/nginx/travellog.access.log;
  error_log  /var/log/nginx/travellog.error.log;

  # Photos : MAX_UPLOAD_MB (64 Mo par défaut)
  client_max_body_size 64m;

  # Fichiers statiques servis directement
  location /static/ {
    alias /opt/travel/app/static/;
    add_header Cache-Control $travellog_static_cache;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    proxy_pass              http://127.0.0.1:5012;
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        X-Forwarded-Host $host;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        Connection "";
    proxy_read_timeout      120;
  }
}
