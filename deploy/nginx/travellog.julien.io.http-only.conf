# Étape transitoire, avant le certificat : validation Let's Encrypt et redirection vers HTTPS uniquement.
# Rien n'est servi en HTTP clair. Remplacé par travellog.julien.io.conf via deploy/enable-https.sh.
server {
  listen 80;
  listen [::]:80;
  server_name travellog.julien.io;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}
